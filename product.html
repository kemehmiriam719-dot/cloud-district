<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product | Cloud District</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="product.css"
    >

</head>


<body>


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="header">


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="images/logo/cloud-district-logo.jpeg"
                    alt="Cloud District"
                >

            </a>

        </div>


        <!-- ========================================
             NAVIGATION
        ========================================= -->

        <nav class="navbar">


            <!-- HOME -->

            <a href="index.html">
                Home
            </a>


            <!-- SHOP -->

            <a href="shop.html">
                Shop
            </a>


            <!-- ========================================
                 VAPE TYPES
            ========================================= -->

            <div class="nav-dropdown">

                <a href="shop.html">
                    Vape Types
                </a>


                <div class="dropdown-menu">

                    <a href="shop.html?type=Disposable%20Vapes">
                        Disposable Vapes
                    </a>

                    <a href="shop.html?type=Vape%20Kits">
                        Vape Kits
                    </a>

                    <a href="shop.html?type=Pods">
                        Pods
                    </a>

                    <a href="shop.html?type=E-Liquids">
                        E-Liquids
                    </a>

                    <a href="shop.html?type=Vaporizers">
                        Vaporizers
                    </a>

                </div>

            </div>


            <!-- ========================================
                 BRANDS
            ========================================= -->

            <div class="nav-dropdown">

                <a href="shop.html">
                    Brands
                </a>


                <div class="dropdown-menu">

                    <a href="shop.html?brand=Alibarbar">
                        Alibarbar
                    </a>

                    <a href="shop.html?brand=Lost%20Mary">
                        Lost Mary
                    </a>

                    <a href="shop.html?brand=HQD">
                        HQD
                    </a>

                    <a href="shop.html?brand=IGET">
                        IGET
                    </a>

                    <a href="shop.html?brand=Elf%20Bar">
                        Elf Bar
                    </a>

                    <a href="shop.html?brand=Geek%20Bar">
                        Geek Bar
                    </a>

                    <a href="shop.html?brand=Vaporesso">
                        Vaporesso
                    </a>

                    <a href="shop.html?brand=OXVA">
                        OXVA
                    </a>

                    <a href="shop.html?brand=RELX">
                        RELX
                    </a>

                    <a href="shop.html?brand=Dry%20Herbs">
                        Dry Herbs
                    </a>

                </div>

            </div>

            <!-- ABOUT -->

            <a href="about.html">
                About
            </a>


            <!-- CONTACT -->

            <a href="contact.html">
                Contact
            </a>


        </nav>


        <!-- ========================================
             CART
        ========================================= -->

        <div class="cart">

            <a href="cart.html">

                🛒

                <span
                    class="cart-count"
                    id="cart-count"
                >
                    0
                </span>

            </a>

        </div>


    </header>


    <!-- ========================================
         PRODUCT PAGE
    ========================================= -->

    <main class="product-page">


        <div class="product-container">


            <!-- ========================================
                 PRODUCT GALLERY
            ========================================= -->

            <div class="product-gallery">


                <!-- MAIN IMAGE -->

                <div class="main-product-image">

                    <img
                        id="main-product-image"
                        src=""
                        alt="Product"
                    >

                </div>


                <!-- THUMBNAILS -->

                <div
                    class="product-thumbnails"
                    id="product-thumbnails"
                >
                </div>


            </div>


            <!-- ========================================
                 PRODUCT INFORMATION
            ========================================= -->

            <section class="product-information">


                <!-- BRAND -->

                <p
                    class="product-brand"
                    id="product-brand"
                >
                </p>


                <!-- PRODUCT NAME -->

                <h1 id="product-name">
                </h1>


                <!-- ========================================
                     PRICE
                ========================================= -->

                <div class="product-price">

                    <span
                        class="old-price"
                        id="old-price"
                    >
                    </span>


                    <span
                        class="sale-price"
                        id="product-price"
                    >
                    </span>

                </div>


                <!-- ========================================
                     DESCRIPTION
                ========================================= -->

                <p
                    class="product-description"
                    id="product-description"
                >
                </p>


                <!-- ========================================
                     FLAVOURS
                ========================================= -->

                <div class="product-options">

                    <h3>
                        Available Flavours
                    </h3>


                    <div
                        id="flavour-options"
                        class="flavour-options"
                    >
                    </div>

                </div>


                <!-- ========================================
                     QUANTITY
                ========================================= -->

                <div class="quantity-section">

                    <h3>
                        Quantity
                    </h3>


                    <div class="quantity-control">


                        <button
                            type="button"
                            id="decrease-quantity"
                            aria-label="Decrease quantity"
                        >
                            −
                        </button>


                        <span id="quantity">
                            1
                        </span>


                        <button
                            type="button"
                            id="increase-quantity"
                            aria-label="Increase quantity"
                        >
                            +
                        </button>


                    </div>

                </div>


                <!-- ========================================
                     ADD TO CART
                ========================================= -->

                <button
                    type="button"
                    id="add-to-cart"
                    class="add-to-cart-button"
                >
                    ADD TO CART
                </button>


            </section>


        </div>


    </main>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script src="js/products.js"></script>

    <script src="js/product.js"></script>


</body>

</html>
